server:
  port: 8080

spring:
  application:
    name: finance-tracker

  # ---- MySQL: transactions, categories, users ----
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:finance_tracker}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${MYSQL_USER:finance_user}
    password: ${MYSQL_PASSWORD:finance_pass}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
    show-sql: false
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  # ---- MongoDB: user sessions & preferences ----
  data:
    mongodb:
      uri: mongodb://${MONGO_HOST:localhost}:${MONGO_PORT:27017}/${MONGO_DATABASE:finance_tracker_mongo}

app:
  jwt:
    secret: ${JWT_SECRET:change-this-super-secret-key-in-production-minimum-256-bits-long}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000} # 24h

  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

logging:
  level:
    com.financetracker: INFO
    org.springframework.security: WARN
